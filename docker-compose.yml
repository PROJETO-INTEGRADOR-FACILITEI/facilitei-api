services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://facilitei-db-facilitei-db.h.aivencloud.com:13238
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-admin}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-sa-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_S3_PUBLIC_BASE_URL: ${AWS_S3_PUBLIC_BASE_URL:-}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      LEGAL_OPERATOR_TYPE: ${LEGAL_OPERATOR_TYPE:-INDIVIDUAL}
      LEGAL_DISPLAY_NAME: ${LEGAL_DISPLAY_NAME:-Arthur Faria Estrela}
      LEGAL_LEGAL_NAME: ${LEGAL_LEGAL_NAME:-}
      LEGAL_TAX_ID: ${LEGAL_TAX_ID:-}
      LEGAL_BUSINESS_ADDRESS: ${LEGAL_BUSINESS_ADDRESS:-}
      LEGAL_CONTACT_EMAIL: ${LEGAL_CONTACT_EMAIL:-contato@facilitei.online}
      LEGAL_PAYMENTS_MODE: ${LEGAL_PAYMENTS_MODE:-TEST}
      MERCADOPAGO_TEST_ACCESS_TOKEN: ${MERCADOPAGO_TEST_ACCESS_TOKEN:-}
      MERCADOPAGO_LIVE_ACCESS_TOKEN: ${MERCADOPAGO_LIVE_ACCESS_TOKEN:-}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      MERCADOPAGO_MONTHLY_AMOUNT_CENTS: ${MERCADOPAGO_MONTHLY_AMOUNT_CENTS:-0}
      MERCADOPAGO_REASON: ${MERCADOPAGO_REASON:-Facilitei - plano profissional}
      MYAPP_CORS_ALLOWED_ORIGINS: ${MYAPP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8080,https://facilitei-front.vercel.app/}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      PASSWORD_MIGRATION_ENABLED: ${PASSWORD_MIGRATION_ENABLED:-true}
      APP_ADMIN_EMAILS: ${APP_ADMIN_EMAILS:-}
