services:
  db:
    image: mysql:8.0.44
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: faciliteidb
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-padmin"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/faciliteidb?createDatabaseIfNotExist=true
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
