spring.application.name=facilitei

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/faciliteidb?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}

spring.docker.compose.enabled=false

# O schema agora é gerenciado pelas migrations em db/migration (V1, V2, V3...).
# baseline-version=3 faz o Flyway tratar um banco existente (criado antes das
# migrations, via ddl-auto=update) como já estando no estado do V3, evitando
# reexecutar V1-V3 nele. Em um banco novo (ex.: docker-compose limpo) as
# migrations rodam normalmente do zero.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=3

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

springdoc.swagger-ui.path=/swagger-ui.html

myapp.cors.allowed-origins=${MYAPP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}

