spring.application.name=facilitei
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

server.servlet.session.timeout=7d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/faciliteidb?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}

spring.docker.compose.enabled=false

# O schema agora é gerenciado pelas migrations em db/migration (V1, V2, V3...).
# baseline-version=3 faz o Flyway tratar um banco existente (criado antes das
# migrations, via ddl-auto=update) como já estando no estado do V3, evitando
# reexecutar V1-V3 nele. Em um banco novo (ex.: docker-compose limpo) as
# migrations rodam normalmente do zero.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=3

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

springdoc.swagger-ui.path=/swagger-ui.html

myapp.cors.allowed-origins=${MYAPP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Limites locais contra abuso. Em mais de uma instancia, substituir por Redis/gateway.
security.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
security.password-migration.enabled=${PASSWORD_MIGRATION_ENABLED:true}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.reset-password-url=${RESET_PASSWORD_URL:http://localhost:5173/reset-password}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# Web Push (VAPID). Sem as chaves, a central de notificacoes continua ativa,
# mas a assinatura push fica desabilitada de forma segura.
web-push.public-key=${WEB_PUSH_PUBLIC_KEY:}
web-push.private-key=${WEB_PUSH_PRIVATE_KEY:}
web-push.subject=${WEB_PUSH_SUBJECT:mailto:contato@facilitei.app}

# Configure um produto com cycle=MONTHLY na AbacatePay antes de habilitar assinaturas.
abacatepay.api-key=${ABACATEPAY_API_KEY:}
abacatepay.product-id=${ABACATEPAY_MONTHLY_PRODUCT_ID:}
abacatepay.webhook-secret=${ABACATEPAY_WEBHOOK_SECRET:}
abacatepay.webhook-public-key=${ABACATEPAY_WEBHOOK_PUBLIC_KEY:}
